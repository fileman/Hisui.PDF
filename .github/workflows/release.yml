name: Release

# Builds self-contained, single-file executables for Windows, Linux and macOS
# and publishes them as downloadable assets on a GitHub Release.
#
# Trigger: run manually from the Actions tab (workflow_dispatch) on the branch to release,
# giving X.Y (e.g. 0.1). The workflow computes X.Y.<commit count> and creates the
# tag vX.Y.<commit count> on that commit when it publishes the release.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Major.minor to release (e.g. 0.1); the patch number is the commit count'
        required: true
      prerelease:
        description: 'Publish as pre-release (not offered by the updater, not sent to winget)'
        type: boolean
        default: false

env:
  PROJECT: src/Hisui.Pdf.App/Hisui.Pdf.App.csproj

jobs:
  # Every artifact (app, MSI, archives) and the tag are versioned X.Y.<commit count>.
  version:
    runs-on: ubuntu-latest
    outputs:
      ver: ${{ steps.v.outputs.ver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the commit count
      - id: v
        env:
          XY: ${{ github.event.inputs.version }}
        run: |
          [[ "$XY" =~ ^[0-9]+\.[0-9]+$ ]] || { echo "version input must be X.Y"; exit 1; }
          echo "ver=$XY.$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.rid }}
    needs: version
    runs-on: ${{ matrix.os }}
    env:
      BUILD_VERSION: ${{ needs.version.outputs.ver }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64,   os: windows-latest, archive: zip }
          - { rid: linux-x64, os: ubuntu-latest,  archive: targz }
          - { rid: osx-x64,   os: macos-latest,   archive: targz }
          - { rid: osx-arm64, os: macos-latest,   archive: targz }
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish (self-contained, single-file)
        shell: bash
        run: |
          dotnet publish "$PROJECT" \
            -c Release \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true \
            -p:Version="$BUILD_VERSION" \
            -p:DebugType=none \
            -p:DebugSymbols=false \
            -o "publish/${{ matrix.rid }}"
          # Drop native symbol files (e.g. libSkiaSharp.pdb ~80 MB) — not needed by users.
          find "publish/${{ matrix.rid }}" -name '*.pdb' -delete

      - name: Archive (tar.gz)
        if: matrix.archive == 'targz'
        shell: bash
        run: |
          name="Hisui.Pdf-v${BUILD_VERSION}-${{ matrix.rid }}"
          chmod +x "publish/${{ matrix.rid }}/Hisui.Pdf.App"
          tar -czf "${name}.tar.gz" -C "publish/${{ matrix.rid }}" .
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "Hisui.Pdf-v$env:BUILD_VERSION-${{ matrix.rid }}"
          Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Unsigned MSI: the in-app updater downloads and runs it (MajorUpgrade replaces the old build).
      - name: Build MSI
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: |
          # MSI versions are numeric x.y.z: drop any -beta suffix
          # the updater reads the version from the MSI name
          $v = $env:BUILD_VERSION
          dotnet publish $env:PROJECT /p:PublishProfile=win-x64 -p:Version="$v"
          dotnet build src/Hisui.Pdf.Installer.Win/Hisui.Pdf.Installer.Win.wixproj -c Release -p:Version="$v"
          # copy to the root so upload-artifact doesn't keep the bin/installer/ directory structure
          Copy-Item "bin/installer/HisuiPDF-$v-win-x64.msi" .
          "MSI=HisuiPDF-$v-win-x64.msi" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.rid }}
          path: |
            ${{ env.ASSET }}
            ${{ env.MSI }}
          retention-days: 5

  release:
    name: Publish GitHub Release
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          Cross-platform desktop PDF editor. Self-contained builds — **no .NET install required**.

          ### Downloads
          | Platform | File |
          |---|---|
          | Windows x64 | `Hisui.Pdf-v__VERSION__-win-x64.zip` or installer `HisuiPDF-__VERSION__-win-x64.msi` (needed by in-app updates) |
          | Linux x64 | `Hisui.Pdf-v__VERSION__-linux-x64.tar.gz` |
          | macOS (Intel) | `Hisui.Pdf-v__VERSION__-osx-x64.tar.gz` |
          | macOS (Apple Silicon) | `Hisui.Pdf-v__VERSION__-osx-arm64.tar.gz` |

          Unpack the archive and run `Hisui.Pdf.App` (`.exe` on Windows).

          > **macOS:** the binary is unsigned — on first launch right-click -> *Open*, or run
          > `xattr -dr com.apple.quarantine Hisui.Pdf.App` to clear Gatekeeper quarantine.
          >
          > **Linux/macOS OCR:** the scanned-PDF OCR feature needs a system Tesseract library
          > (`apt install libtesseract5` / `brew install tesseract`). All other features work standalone.
          EOF
          sed -i "s/__VERSION__/${{ needs.version.outputs.ver }}/g" notes.md

      - name: Create / update release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v${{ needs.version.outputs.ver }}"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            pre=""; [[ "${{ github.event.inputs.prerelease }}" == "true" ]] && pre="--prerelease"
            gh release create "$tag" dist/* $pre --target "$GITHUB_SHA" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Hisui PDF $tag" \
              --notes-file notes.md
          fi

  # Submits stable releases to winget. Enable after the package's first manual submission:
  #   wingetcreate new <MSI release URL>   (id Fileman.HisuiPDF)
  # then set repo variable WINGET_ENABLED=true and secret WINGET_TOKEN (classic PAT, public_repo).
  winget:
    name: Submit to winget
    needs: [version, release]
    if: ${{ vars.WINGET_ENABLED == 'true' && github.event.inputs.prerelease != 'true' }}
    runs-on: windows-latest
    steps:
      - name: wingetcreate update
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          BUILD_VERSION: ${{ needs.version.outputs.ver }}
        run: |
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/v$env:BUILD_VERSION/HisuiPDF-$env:BUILD_VERSION-win-x64.msi"
          ./wingetcreate.exe update Fileman.HisuiPDF --version $env:BUILD_VERSION --urls $url --submit --token $env:WINGET_TOKEN
